name: Fix QPR Pointers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # Restore correct QPR-LFS-R2 pointers from the original migration merge
      # commit (f08f5c4). These point to real binaries already stored in R2.
      # Commit 53103ea (the previous source) is AFTER .gitattributes was restored
      # with filter=lfs, which smudged files back to binary.
      - name: Restore correct QPR pointers from f08f5c4
        run: |
          echo "Finding files with broken QPR pointers..."
          BROKEN_FILES=$(git grep -l '^# QPR-LFS-R2' HEAD -- \
            '*.pdf' '*.doc' '*.docx' '*.ppt' '*.pptx' \
            '*.xls' '*.xlsx' '*.jpg' '*.jpeg' '*.png' \
            '*.gif' '*.webp' '*.bmp' '*.svg' '*.zip')

          FIXED=0
          SKIPPED=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            file="${file#HEAD:}"
            CONTENT=$(git cat-file -p "f08f5c4:$file" 2>/dev/null | head -3)
            if echo "$CONTENT" | grep -q "^# QPR-LFS-R2"; then
              SIZE=$(echo "$CONTENT" | grep "^size:" | cut -d: -f2)
              if [ "$SIZE" -gt 500 ] 2>/dev/null; then
                git checkout "f08f5c4" -- "$file"
                FIXED=$((FIXED + 1))
              else
                SKIPPED=$((SKIPPED + 1))
              fi
            else
              SKIPPED=$((SKIPPED + 1))
            fi
          done <<< "$BROKEN_FILES"
          echo "Fixed: $FIXED, Skipped: $SKIPPED"

      - name: Commit and push
        run: |
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          FILE_COUNT=$(git diff --name-only | wc -l)
          echo "$FILE_COUNT files changed"

          git add .
          git commit -m "Restore correct QPR-LFS-R2 pointers from original migration ($FILE_COUNT files)"
          git push
