name: Migrate Files to LFS (R2)

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to migrate (where binary files live)'
        required: true
        default: 'main'
      dry_run:
        description: 'Dry run (preview only, no changes)'
        required: false
        type: boolean
        default: false
      concurrency:
        description: 'Max parallel uploads'
        required: false
        default: '10'

permissions:
  contents: write
  pull-requests: write

jobs:
  migrate-to-lfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run migration
        env:
          FILE_SERVER_URL: ${{ secrets.LFS_FILE_SERVER_URL || 'https://qpr-file-server.turingclub.workers.dev' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          CONCURRENCY: ${{ github.event.inputs.concurrency }}
          ALLOW_PARTIAL_FAILURES: "1"
        run: node scripts/migrate-to-lfs.js

      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lfs-migration-report
          path: scripts/lfs-migration-report.txt
          if-no-files-found: ignore

      - name: Commit and push changes
        if: github.event.inputs.dry_run != 'true'
        env:
          GIT_LFS_SKIP_PUSH: "1"
          TARGET_BRANCH: ${{ github.event.inputs.target_branch }}
          MIGRATION_BRANCH: lfs-migration-${{ github.run_id }}
        run: |
          # Disable LFS clean/smudge filters — we write pointers directly
          git config --local filter.lfs.clean true
          git config --local filter.lfs.smudge true
          git config --local filter.lfs.process true
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .

          # Check if there are changes to commit
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          N_FILES=$(git diff --cached --name-only | wc -l)
          echo "Committing $N_FILES files..."

          # Single commit, push to a TEMP branch (avoids main's push complexity)
          git commit -m "Migrate $N_FILES binary files to LFS pointers (R2 backend) [skip ci]"
          git push --no-thin origin "HEAD:$MIGRATION_BRANCH"

          echo "Pushed to $MIGRATION_BRANCH. Creating PR to merge into $TARGET_BRANCH..."
          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$MIGRATION_BRANCH" \
            --title "LFS Migration: $(date +%Y-%m-%d)" \
            --body "Automated migration of binary files to LFS pointers (Cloudflare R2 backend).\n\n$N_FILES files converted.\n\nMerge this PR to complete the migration." \
            --label "lfs-migration"

          echo "PR created. Visit the PR to merge."
