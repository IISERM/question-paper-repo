name: Migrate Files to LFS (R2)

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to migrate (where binary files live)'
        required: true
        default: 'main'
      dry_run:
        description: 'Dry run (preview only, no changes)'
        required: false
        type: boolean
        default: false
      concurrency:
        description: 'Max parallel uploads'
        required: false
        default: '10'

permissions:
  contents: write
  pull-requests: write

jobs:
  migrate-to-lfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run migration
        env:
          FILE_SERVER_URL: ${{ secrets.LFS_FILE_SERVER_URL || 'https://qpr-file-server.turingclub.workers.dev' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          CONCURRENCY: ${{ github.event.inputs.concurrency }}
          ALLOW_PARTIAL_FAILURES: "1"
        run: node scripts/migrate-to-lfs.js

      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lfs-migration-report
          path: scripts/lfs-migration-report.txt
          if-no-files-found: ignore

      - name: Commit and push changes
        if: github.event.inputs.dry_run != 'true'
        env:
          GIT_LFS_SKIP_PUSH: "1"
          TARGET_BRANCH: ${{ github.event.inputs.target_branch }}
          MIGRATION_BRANCH: lfs-migration-${{ github.run_id }}
        run: |
          # Disable LFS clean/smudge filters — we write pointers directly
          # Use 'cat' (passthrough), NOT 'true' (which outputs nothing)
          git config --local filter.lfs.clean cat
          git config --local filter.lfs.smudge cat
          git config --local filter.lfs.process cat
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          echo "add done"

          # Check if there are changes to commit
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          N_FILES=$(git diff --cached --name-only | wc -l)
          echo "Staged $N_FILES files."

          # Commit in batches to avoid push size limits
          STAGED=$(git diff --cached --name-only)
          BATCH_SIZE=100
          COUNT=0
          BATCH=1

          while IFS= read -r file; do
            git reset -q HEAD -- "$file" 2>/dev/null || true
            git add "$file"
            COUNT=$((COUNT + 1))
            if [ $COUNT -ge $BATCH_SIZE ]; then
              echo "Committing batch $BATCH ($COUNT files)..."
              git commit -m "Migrate binary files to LFS pointers (batch $BATCH) [skip ci]" || true
              echo "Pushing batch $BATCH..."
              git push --no-thin origin "HEAD:$MIGRATION_BRANCH" || { echo "Push failed on batch $BATCH"; exit 1; }
              echo "Batch $BATCH pushed."
              COUNT=0
              BATCH=$((BATCH + 1))
            fi
          done <<< "$STAGED"

          # Final batch
          if [ $COUNT -gt 0 ]; then
            echo "Committing final batch ($COUNT files)..."
            git commit -m "Migrate binary files to LFS pointers (batch $BATCH) [skip ci]" || true
            echo "Pushing final batch..."
            git push --no-thin origin "HEAD:$MIGRATION_BRANCH" || { echo "Push failed on final batch"; exit 1; }
            echo "Final batch pushed."
          fi

          echo "Migration pushed in $((BATCH)) batch(es) to $MIGRATION_BRANCH."
          echo "Create a PR from $MIGRATION_BRANCH to $TARGET_BRANCH to complete."
