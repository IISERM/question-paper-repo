name = "qpr-contribution-worker"
main = "src/index.js"
compatibility_date = "2024-01-01"
account_id = "2a541d3bfd006a6bafac02bc4760031c"

# Secrets to add via: wrangler secret put SECRET_NAME
# 
# For GitHub OAuth (fallback system):
# GITHUB_CLIENT_ID
# GITHUB_CLIENT_SECRET
#
# For GitHub App (new direct contribution system):
# GITHUB_APP_ID
# GITHUB_APP_PRIVATE_KEY (full PEM format including headers)
# GITHUB_APP_INSTALLATION_ID
#
# For GitHub Webhooks (PR comment notifications):
# GITHUB_WEBHOOK_SECRET (secret configured in GitHub webhook settings)
#
# For Email Notifications (EmailJS):
# EMAILJS_SERVICE_ID   (EmailJS service ID, e.g. "service_xxxxxx")
# EMAILJS_TEMPLATE_ID  (EmailJS template ID, e.g. "template_xxxxxx")
# EMAILJS_PUBLIC_KEY   (EmailJS public key, used as user_id in API calls)
# EMAILJS_PRIVATE_KEY  (Optional: required if EmailJS strict mode / server requests enabled)

[vars]
GITHUB_REPO_OWNER = "IISERM"
GITHUB_REPO_NAME = "question-paper-repo"
FRONTEND_URL = "https://iiserm.github.io"
ALLOWED_EMAIL_DOMAIN = "iisermohali.ac.in"

# Shared secret for signing file URLs (use wrangler secret put in production)
SIGNING_SECRET = "change-me-in-production-use-wrangler-secret-put"
# Firebase project ID for token validation
FIREBASE_PROJECT_ID = "qpr-iiserm"

[[kv_namespaces]]
binding = "PAGE_VIEW_STORE"
id = "c0f6433e94c743719f17e96d2f6b9987"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "qpr-lfs"
